# Built-in preset "editorial": quiet paper, ink and one rust accent; hairline borders, no shadows.
# Tuned after blind judge round 13 (2026-11-08): white cards on the paper, bold serif titles, an ink takeaway bar,
# one arrow colour, and the accent kept off timeline dots and agenda numbers.
# Palette and rules adapted from diagram-design by Cathryn Lavery (MIT).
# The accent is for 1-2 focal elements per slide (`.focal`, `hl=`, the cover rule); series are ink and slate.
colors:
  bg: "#F5F5F5"
  fg: "#2D3142"
  primary: "#2D3142"
  secondary: "#4F5D75"
  accent: "#BF4520"
  muted: "#5A6580"
  border: "#BFC0C0"
  surface: "#FFFFFF"
  danger: "#9B3A2B"
  success: "#46704A"
  link: "#2E5AA8"
fonts: {heading: Georgia, body: Arial, mono: Consolas, ea: Yu Gothic}
sizes:
  title: 38
  subtitle: 20
  heading: 20
  body: 17
  lead: 22
  caption: 12
  footnote: 10
  table: 15
  cover-title: 52
  cover-subtitle: 22
title_color: primary
title_bold: true
heading_color: primary
lead_color: secondary
cover_band_h: 0
cover_rule: accent
cover_rule_w: 0.9in
cover_rule_h: 0.04in
cover_rule_pos: above
table_header_fill: bg
table_header_color: primary
table_body_fill: bg
table_hl_fill: accent
table_hl_strength: 0.1
conclusion_fill: primary
conclusion_color: bg
timeline_dot: secondary
agenda_num_color: primary
icon_disc: "#E3E5EA"
icon_color: primary
# series colors: ink first, then muted slate / sage / sand / clay / mauve (the accent is reserved for `hl=`)
palette: [primary, "#5E7A9B", "#7C8F6F", "#B8915A", "#9C6B50", "#6E6479"]
# diagram kit (@arch @swimlane @sequence @venn): fixed type scale, hairline cards, mono capitals for tags,
# arrow labels and captions; arrows slate / accent (primary) / link blue (HTTP) / dashed (return)
diagram_name_size: 13
diagram_sub_size: 9
diagram_tag_size: 8
diagram_label_size: 8
diagram_tag_track: 0.18
diagram_label_track: 0.08
diagram_legend: auto
diagram_arrow_primary: accent
diagram_arrow_http: link
diagram_return_dash: dash
arch_tier_look: auto
sequence_lifeline: border
diagram_act_fill: "#E3E5EA"
diagram_act_line: muted
venn_fill: primary
venn_alpha: 0.06
venn_line: secondary
venn_line_w: 0.9pt
venn_core: primary
render:
  connector_color: secondary
  connector_width: 1
  line_width: 0.75
classes:
  # hairline cards on the paper: white fill, #BFC0C0 border, small corners, no shadow
  card: {fill: "#FFFFFF", line: border, line_width: 0.75, radius: 4, padding: 10pt}
  callout: {fill: "#ECECEC", line: border, line_width: 0.75, radius: 4}
  chart-note: {fill: "#FFFFFF", line: accent, line_width: 0.75, radius: 3, bold: false}
  node: {fill: "#FFFFFF", line: secondary, line_width: 1, radius: 4, padding: 6pt}
  decision: {fill: "#FFFFFF", line: secondary}
  kpi: {color: primary}
  rows: {fill: "#FFFFFF", line: border, line_width: 0.75}
  rows-num: {fill: primary, color: bg}
  steps-arrow: {fill: primary}
  # diagram roles: `## Postgres {.store}` or mermaid `A[DB]:::store`
  focal: {fill: "#BF452014", line: accent, line_width: 1.25}
  store: {fill: "#2D31420D", line: muted}
  external: {fill: "#2D314208", line: border}
  input: {fill: "#4F5D751A", line: muted}
  optional: {line: muted, line_dash: dash}
  security: {fill: "#BF45200D", line: accent, line_dash: dash}
