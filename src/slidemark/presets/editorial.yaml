# Built-in preset "editorial": quiet paper, ink and one rust accent; hairline borders, no shadows.
# Faithful to the source (owner, 2026-11-08): serif titles in the regular weight, a paper-2 takeaway bar with ink
# text, white cards with hairline borders, one arrow colour, the accent only on the focal element.
# Palette and rules adapted from diagram-design by Cathryn Lavery (MIT).
# The accent is for 1-2 focal elements per slide (`.focal`, `hl=`, the cover rule); series are ink and slate.
colors:
  bg: "#F5F5F5"
  fg: "#2D3142"
  primary: "#2D3142"
  secondary: "#4F5D75"
  accent: "#BF4520"
  muted: "#5A6580"
  border: "#BFC0C0"
  surface: "#ECECEC"
  danger: "#9B3A2B"
  success: "#46704A"
  link: "#2E5AA8"
fonts: {heading: Georgia, body: Arial, mono: Consolas, ea: Yu Gothic}
sizes:
  title: 38
  subtitle: 14
  heading: 14
  body: 14
  lead: 14
  caption: 12
  footnote: 10
  table: 12
  cover-title: 52
  cover-subtitle: 22
eyebrow: section
title_color: primary
title_bold: false
heading_color: primary
heading_font: body
lead_color: secondary
cover_band_h: 0
cover_rule: accent
cover_rule_w: 0.9in
cover_rule_h: 0.04in
cover_rule_pos: above
table_header_fill: bg
table_header_color: primary
table_rules: rows
table_head_rule: primary
table_body_fill: bg
table_hl_fill: accent
table_hl_strength: 0.1
conclusion_fill: surface
conclusion_color: primary
timeline_dot: secondary
agenda_num_color: primary
icon_disc: "#E3E5EA"
icon_color: primary
# series colors: ink first, then muted slate / sage / sand / clay / mauve (the accent is reserved for `hl=`)
palette: [primary, "#5E7A9B", "#7C8F6F", "#B8915A", "#9C6B50", "#6E6479"]
render:
  connector_color: secondary
  connector_width: 1
  line_width: 0.75
  chart_title_scale: 1.0
  chart_title_bold: false
  chart_label_scale: 0.9
  chart_legend_scale: 0.9
  chart_text_ratio: 0
  chart_hl_first: true
classes:
  # hairline cards on the paper: white fill, #BFC0C0 border, small corners, no shadow
  card: {fill: "#FFFFFF", line: border, line_width: 0.75, radius: 4, padding: 10pt, font_size: 13}
  callout: {fill: "#ECECEC", line: border, line_width: 0.75, radius: 4}
  chart-note: {fill: bg, line: accent, line_width: 0, radius: 3, bold: false, italic: true, color: accent, font: Georgia}
  node: {fill: "#FFFFFF", line: secondary, line_width: 1, radius: 4, padding: 6pt}
  diagram-node: {bold: true, font_size: 12}
  decision: {fill: "#FFFFFF", line: secondary}
  kpi: {color: primary}
  rows: {fill: "#FFFFFF", line: border, line_width: 0.75}
  rows-num: {fill: primary, color: bg}
  steps-arrow: {fill: primary}
  # diagram roles: `## Postgres {.store}` or mermaid `A[DB]:::store`
  focal: {fill: "#BF452014", line: accent, line_width: 1.25}
  store: {fill: "#2D31420D", line: muted}
  external: {fill: "#2D314208", line: border}
  input: {fill: "#4F5D751A", line: muted}
  optional: {line: muted, line_dash: dash}
  security: {fill: "#BF45200D", line: accent, line_dash: dash}
layout:
  grow_max: 1
  l3_fill: false
  cards_to_body: false
  kpi_to_body: false
  steps_stretch: false
  card_stretch: false
  top_gap: 0.3in
  body_valign: center
  beside_min: 0
  beside_align: 1.0
  sparse_note: 1
  center_min_fill: 0
  table_grow: 1
  table_alone_grow: 1
  table_grow_roomy: 1
  table_free: false
  table_fill_width: true
  diagram_grow: 1
  html_hug: true
  cjk_phrase_lines: true
