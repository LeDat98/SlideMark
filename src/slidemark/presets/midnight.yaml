# Built-in preset "midnight": dark slides, sky-blue accents.
colors:
  bg: "#0F172A"
  fg: "#E2E8F0"
  primary: "#38BDF8"
  secondary: "#2DD4BF"
  accent: "#FBBF24"
  muted: "#94A3B8"
  border: "#334155"
  surface: "#1E293B"
  danger: "#F87171"
  success: "#4ADE80"
title_color: primary
lead_color: fg
table_header_fill: "#334155"
classes:
  card: {radius: 8}
  callout: {fill: surface, line_width: 1.25}
  chart-note: {fill: surface}
table_hl_fill: accent
table_hl_strength: 0.2
# series colors: primary, secondary, slate, then deeper / softer shades (the accent is reserved for `hl=`)
palette: [primary, secondary, muted, "#2B7FA6", "#7AD9CD", "#475569"]
