  <alias binding="same"><family>Noto Serif JP</family><prefer><family>Liberation Serif</family><family>IPAPGothic</family></prefer></alias>
  <alias binding="same"><family>Noto Serif CJK JP</family><prefer><family>Liberation Serif</family><family>IPAPGothic</family></prefer></alias>
  <alias binding="same"><family>BIZ UDPMincho</family><prefer><family>Liberation Serif</family><family>IPAPGothic</family></prefer></alias>
