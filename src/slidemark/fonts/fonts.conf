<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic fonts for previews (slidemark.preview.pptx_to_pngs sets FONTCONFIG_FILE to this file when the
  variable is not already set; Linux only). The Office / brand fonts that decks ask for are not installed here,
  and what fontconfig picks for them differs between machines. Every family below maps to ONE installed family:

    CJK sans (Meiryo, Yu Gothic, Hiragino ...)    -> IPAPGothic   (MS Gothic -> IPAGothic: fixed width)
    sans (Arial, Calibri, Inter, Montserrat ...)  -> Liberation Sans   (Calibri: Carlito when installed)
    serif (Georgia, Times, Cambria, Mincho ...)   -> Liberation Serif
    mono (Consolas, Courier New ...)              -> Liberation Mono
    any other family                              -> the generic sans-serif / serif / monospace rule

  CJK glyphs missing from a Latin family come from IPAPGothic (listed second), not WenQuanYi / DejaVu.
  To use Noto Sans CJK instead (apt-get install fonts-noto-cjk), put "Noto Sans CJK JP" first in the CJK lists
  (the golden images are made without it). Docs: docs/RENDERING.md.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- CJK sans -->
  <alias binding="same"><family>Meiryo</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Meiryo UI</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic UI</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic Medium</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic Light</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>MS PGothic</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>MS UI Gothic</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Hiragino Sans</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic ProN</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic Pro</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Hiragino Maru Gothic ProN</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>BIZ UDPGothic</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>BIZ UDGothic</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Noto Sans JP</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Noto Sans CJK JP</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Source Han Sans</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Osaka</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>IPAPGothic</family><family>IPAGothic</family></prefer></alias>
  <!-- CJK fixed width -->
  <alias binding="same"><family>MS Gothic</family><prefer><family>IPAGothic</family><family>IPAPGothic</family></prefer></alias>
  <alias binding="same"><family>Osaka-Mono</family><prefer><family>IPAGothic</family><family>IPAPGothic</family></prefer></alias>
  <!-- CJK serif: no CJK serif font is installed, so Latin serif + Gothic kana / kanji -->
  <alias binding="same"><family>Yu Mincho</family><prefer><family>Liberation Serif</family><family>IPAPGothic</family></prefer></alias>
